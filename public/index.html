<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot IA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid #2a2a2a;
    }

    #sidebar-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    #new-chat-btn {
      margin: 12px 12px 0;
      padding: 10px 14px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s;
    }
    #new-chat-btn:hover { background: #252525; }
    #new-chat-btn svg { flex-shrink: 0; }

    #conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #conversations-list::-webkit-scrollbar { width: 4px; }
    #conversations-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .conv-item {
      padding: 10px 16px;
      font-size: 13px;
      color: #aaa;
      cursor: pointer;
      border-radius: 6px;
      margin: 2px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }
    .conv-item:hover { background: #1e1e1e; color: #e8e8e8; }
    .conv-item.active { background: #252525; color: #fff; }

    /* ── Main ────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    /* empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #555;
    }
    #empty-state svg { opacity: .4; }
    #empty-state p { font-size: 16px; }

    .message-row {
      padding: 8px 0;
      display: flex;
      justify-content: center;
    }

    .message-row.user { background: transparent; }
    .message-row.assistant { background: #141414; }

    .message-inner {
      width: 100%;
      max-width: 720px;
      padding: 0 24px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }
    .avatar.user { background: #3b82f6; color: #fff; }
    .avatar.assistant { background: #10a37f; color: #fff; }

    .bubble {
      flex: 1;
      font-size: 15px;
      line-height: 1.65;
      color: #e0e0e0;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 4px 0;
    }

    /* thinking dots */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Input area ──────────────────────────── */
    #input-area {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: center;
    }

    #input-wrap {
      width: 100%;
      max-width: 720px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      transition: border-color .2s;
    }
    #input-wrap:focus-within { border-color: #555; }

    #msg-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
      font-family: inherit;
    }
    #msg-input::placeholder { color: #555; }

    #send-btn {
      width: 34px;
      height: 34px;
      background: #10a37f;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
    }
    #send-btn:hover { background: #0d8f6f; }
    #send-btn:disabled { opacity: .4; cursor: default; }
    #send-btn svg { color: #fff; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-header"><h2>Conversaciones</h2></div>
  <button id="new-chat-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Nueva conversación
  </button>
  <div id="conversations-list"></div>
</aside>

<!-- Main chat -->
<main id="main">
  <div id="messages">
    <div id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Empieza una nueva conversación</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="msg-input" rows="1" placeholder="Escribe un mensaje…"></textarea>
      <button id="send-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</main>

<script>
  let conversationId = null;

  const messagesEl   = document.getElementById('messages');
  const emptyState   = document.getElementById('empty-state');
  const input        = document.getElementById('msg-input');
  const sendBtn      = document.getElementById('send-btn');
  const convList     = document.getElementById('conversations-list');
  const newChatBtn   = document.getElementById('new-chat-btn');

  /* ── auto-resize textarea ── */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    sendBtn.disabled = !input.value.trim();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', sendMessage);
  newChatBtn.addEventListener('click', newChat);

  /* ── helpers ── */
  function newChat() {
    conversationId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    input.focus();
  }

  function appendMessage(role, text) {
    emptyState.remove();

    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const inner = document.createElement('div');
    inner.className = 'message-inner';

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'user' ? 'Tú' : 'IA';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    inner.appendChild(avatar);
    inner.appendChild(bubble);
    row.appendChild(inner);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    emptyState.remove();
    const row = document.createElement('div');
    row.className = 'message-row assistant';
    row.id = 'typing-row';

    const inner = document.createElement('div');
    inner.className = 'message-inner';

    const avatar = document.createElement('div');
    avatar.className = 'avatar assistant';
    avatar.textContent = 'IA';

    const dots = document.createElement('div');
    dots.className = 'typing';
    dots.innerHTML = '<span></span><span></span><span></span>';

    inner.appendChild(avatar);
    inner.appendChild(dots);
    row.appendChild(inner);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing-row')?.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', text);
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        appendMessage('assistant', '⚠️ ' + (data.error || 'Error del servidor'));
        return;
      }

      conversationId = data.conversationId;
      appendMessage('assistant', data.message.content);
      if (data.title) {
        const item = convList.querySelector(`[data-id="${data.conversationId}"]`);
        if (item) item.textContent = data.title;
      }
      loadConversations();
    } catch (err) {
      removeTyping();
      appendMessage('assistant', '⚠️ No se pudo conectar con el servidor.');
    }
  }

  /* ── conversations sidebar ── */
  async function loadConversations() {
    try {
      const res = await fetch('/api/conversations');
      const list = await res.json();
      convList.innerHTML = '';
      list.forEach(conv => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (conv.id === conversationId ? ' active' : '');
        item.textContent = conv.title || 'Sin título';
        item.dataset.id = conv.id;
        item.addEventListener('click', () => loadConversation(conv.id, item));
        convList.appendChild(item);
      });
    } catch {}
  }

  async function loadConversation(id, itemEl) {
    conversationId = id;
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    itemEl.classList.add('active');

    try {
      const res = await fetch(`/api/conversations/${id}/messages`);
      const msgs = await res.json();
      messagesEl.innerHTML = '';
      if (msgs.length === 0) {
        messagesEl.appendChild(emptyState);
        return;
      }
      msgs.forEach(m => appendMessage(m.role, m.content));
    } catch {}
  }

  loadConversations();
</script>
</body>
</html>
